# Akka HTTP tuning for the load test.
akka.http {

  # ---- INBOUND: the SingleFlight server on :8080 ----
  # The earlier "Connection refused" came from these ceilings overflowing when
  # Gatling opened connections faster than they were accepted. Raise them.
  server {
    max-connections = 4096   # concurrent connections the server will hold
    backlog         = 1024   # OS accept queue for pending connections
  }

  # ---- OUTBOUND: the client pool used to call the third party on :9090 ----
  # Single-flight keeps outbound calls tiny, but size the pool generously so it
  # never becomes the bottleneck and never fails fast with "max-open-requests".
  host-connection-pool {
    max-connections   = 512    # concurrent connections per target host
    max-open-requests = 1024   # queued+in-flight requests (must be a power of 2)
  }
}
